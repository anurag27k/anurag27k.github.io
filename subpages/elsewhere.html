<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elsewhere — a random view of Earth</title>
<meta name="description" content="Get dropped into a random beautiful place on Earth, in Google Street View.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-deep:#06080B;
    --bone:#F4F1EB;
    --haze:#9AA3AE;
    --sodium:#E8A33D;
    --edge:rgba(244,241,235,.16);
    --edge-soft:rgba(244,241,235,.09);
    --glass:rgba(11,14,18,.60);
    --pad:clamp(14px,3.2vw,26px);
    --cycle:60s;
    /* how far the panorama overhangs the window, hiding Google's own chrome */
    --crop-t:96px; --crop-l:250px; --crop-r:250px; --crop-b:180px;
    /* Drift: --pan-range is how far it travels, --pan-time how long one
       pass takes. Lower the time to go faster.
       80s ≈ 5px/s (gentle) · 30s ≈ 14px/s (current) · 15s ≈ 28px/s (brisk) */
    --pan-range:420px; --pan-time:30s;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink-deep);
    color:var(--bone);
    font-family:"Kalam",ui-rounded,system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- the view ----------
     The panorama is deliberately larger than the window and offset, so the
     controls Google anchors to its corners fall outside the visible area. */
  .stage{position:fixed;inset:0;overflow:hidden;background:var(--ink-deep)}
  .frame{
    position:absolute;border:0;display:block;
    top:calc(var(--crop-t) * -1);
    left:calc(var(--crop-l) * -1);
    width:calc(100% + var(--crop-l) + var(--crop-r) + var(--pan-range));
    height:calc(100% + var(--crop-t) + var(--crop-b));
    opacity:1;transition:opacity .6s ease;
    will-change:transform;transform:translateX(0);
  }
  .stage.is-loading .frame{opacity:0}

  /* The window slides across the wider render, so the scene drifts
     right to left. Google's corner chrome stays outside the view at
     both ends of the travel. */
  .frame.is-panning{animation:drift var(--pan-time) linear infinite alternate}
  @keyframes drift{
    from{transform:translateX(0)}
    to{transform:translateX(calc(var(--pan-range) * -1))}
  }

  .scrim{position:fixed;left:0;right:0;pointer-events:none;z-index:2}
  .scrim--top{top:0;height:min(38vh,320px);
    background:linear-gradient(180deg,rgba(6,8,11,.80) 0%,rgba(6,8,11,.44) 42%,rgba(6,8,11,0) 100%)}
  .scrim--bottom{bottom:0;height:min(38vh,320px);
    background:linear-gradient(0deg,rgba(6,8,11,.84) 0%,rgba(6,8,11,.38) 50%,rgba(6,8,11,0) 100%)}

  /* ---------- placard ---------- */
  .placard{
    position:fixed;z-index:4;
    top:calc(var(--pad) + env(safe-area-inset-top,0px));
    left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(10px,1.8vw,15px) clamp(22px,3.6vw,32px) clamp(11px,1.7vw,15px);
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(1.2);
    -webkit-backdrop-filter:blur(20px) saturate(1.2);
    border:1px solid var(--edge-soft);
    border-radius:28px;
    max-width:min(560px,calc(100vw - var(--pad)*2));
    box-shadow:0 20px 55px -26px rgba(0,0,0,.95);
  }

  .place{
    font-family:"Caveat",cursive;
    font-weight:600;
    font-size:clamp(30px,6.2vw,50px);
    line-height:1.02;letter-spacing:.004em;text-align:center;margin:0;
    transition:opacity .34s ease,transform .34s ease;
  }
  .placard.is-swapping .place{opacity:0;transform:translateY(-5px)}

  .rule{
    position:relative;width:100%;height:1px;
    margin:clamp(8px,1.4vw,11px) 0 clamp(7px,1.1vw,9px);
    background:var(--edge);overflow:hidden;border-radius:1px;
  }
  .rule__fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(232,163,61,.45)}
  .rule__fill.is-running{animation:creep var(--cycle) linear forwards}
  @keyframes creep{from{width:0}to{width:100%}}
  .rule::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,var(--sodium),transparent);
    transform:translateX(-101%);
  }
  .rule.is-locking::after{animation:sweep .85s cubic-bezier(.32,.72,.28,1)}
  @keyframes sweep{to{transform:translateX(101%)}}

  .meta{
    display:flex;align-items:baseline;justify-content:center;
    gap:clamp(10px,2.4vw,18px);width:100%;
    font-size:clamp(11px,1.9vw,13px);font-weight:400;
  }
  .country{color:var(--haze);letter-spacing:.10em;white-space:nowrap}
  .coords{
    color:var(--bone);font-weight:300;letter-spacing:.02em;
    white-space:nowrap;display:inline-block;text-align:center;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  }
  .coords.is-searching{color:var(--sodium)}

  /* ---------- bottom stack ---------- */
  .dock{
    position:fixed;z-index:4;
    bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px) + 26px);
    left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    max-width:calc(100vw - var(--pad)*2);
  }
  .controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}

  .btn{
    appearance:none;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    font-family:"Caveat",cursive;
    font-size:clamp(15px,2.4vw,17px);font-weight:500;letter-spacing:.012em;
    color:var(--bone);background:var(--glass);
    backdrop-filter:blur(20px) saturate(1.2);
    -webkit-backdrop-filter:blur(20px) saturate(1.2);
    border:1px solid var(--edge-soft);border-radius:999px;
    padding:9px 18px 10px;white-space:nowrap;line-height:1;
    transition:border-color .25s ease,background .25s ease,transform .2s ease;
  }
  .btn:hover{border-color:rgba(232,163,61,.55);background:rgba(11,14,18,.78)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:1.5px solid var(--sodium);outline-offset:3px}
  .btn svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round;opacity:.8;transition:color .25s ease,opacity .25s ease}
  .btn--go:hover svg{transform:rotate(180deg);transition:transform .5s cubic-bezier(.32,.72,.28,1)}

  .btn--icon{padding:10px 12px;gap:0}
  .btn--icon.is-on svg{opacity:1;color:var(--sodium)}
  .btn--icon .ico-on{display:none}
  .btn--icon.is-on .ico-on{display:block}
  .btn--icon.is-on .ico-off{display:none}
  .btn--sound.is-armed{animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{border-color:var(--edge-soft)}50%{border-color:rgba(232,163,61,.45)}}

  .credit{
    font-family:"Caveat",cursive;font-size:16px;font-weight:400;
    color:rgba(154,163,174,.85);letter-spacing:.01em;line-height:1;margin:0;
  }
  .credit a{
    color:var(--bone);text-decoration:none;
    border-bottom:1px solid rgba(232,163,61,.45);padding-bottom:1px;
    transition:color .22s ease,border-color .22s ease;
  }
  .credit a:hover{color:var(--sodium);border-bottom-color:var(--sodium)}
  .credit a:focus-visible{outline:1.5px solid var(--sodium);outline-offset:3px;border-radius:4px}

  /* Google's own logo is cropped away with the rest of its chrome,
     so the imagery credit is restated here, bottom centre. */
  .attribution{
    position:fixed;z-index:4;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 9px);
    font-size:10.5px;font-weight:300;letter-spacing:.04em;
    color:rgba(154,163,174,.62);text-decoration:none;
    transition:color .22s ease;
  }
  .attribution:hover{color:var(--haze)}
  .attribution:focus-visible{outline:1.5px solid var(--sodium);outline-offset:3px;border-radius:4px}

  .toast,.hint{
    position:fixed;z-index:5;left:50%;
    bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px) + 116px);
    font-family:"Caveat",cursive;white-space:nowrap;pointer-events:none;
  }
  .toast{
    transform:translate(-50%,6px);font-size:16px;color:var(--sodium);
    background:var(--glass);border:1px solid rgba(232,163,61,.32);border-radius:999px;
    padding:6px 16px 7px;line-height:1;
    opacity:0;transition:opacity .3s ease,transform .3s ease;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  }
  .toast.is-on{opacity:1;transform:translate(-50%,0)}
  .hint{transform:translateX(-50%);font-size:15px;color:rgba(154,163,174,.8);
    opacity:0;transition:opacity .8s ease}
  .hint.is-on{opacity:1}

  @media (max-width:540px){
    :root{--crop-t:80px;--crop-l:180px;--crop-r:180px;--crop-b:150px;--pan-range:200px}
    .btn{padding:9px 14px 10px;font-size:15px}
    .btn--icon{padding:9px 11px}
    .lbl-full{display:none}
    .lbl-short{display:inline}
    .toast,.hint{bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px) + 156px)}
  }
  .lbl-short{display:none}

  @media (prefers-reduced-motion:reduce){
    *,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.12s !important}
    .rule__fill.is-running{animation:none !important}
  }
</style>
</head>
<body>

<div class="stage is-loading" id="stage">
  <iframe class="frame" id="pano" title="Street View of the current location"
    allow="accelerometer; gyroscope"
    referrerpolicy="no-referrer-when-downgrade" loading="eager"></iframe>
</div>

<div class="scrim scrim--top"></div>
<div class="scrim scrim--bottom"></div>

<div class="placard" id="placard">
  <h1 class="place" id="place">Elsewhere</h1>
  <div class="rule" id="rule"><span class="rule__fill" id="fill"></span></div>
  <div class="meta">
    <span class="country" id="country">Earth</span>
    <span class="coords is-searching" id="coords">00.0000&deg;N  000.0000&deg;E</span>
  </div>
</div>

<div class="hint" id="hint">Drag to look around</div>
<div class="toast" id="toast">Location copied</div>

<div class="dock">
  <div class="controls">
    <button class="btn btn--go" id="go" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/></svg>
      <span class="lbl-full">Drop me elsewhere</span><span class="lbl-short">Elsewhere</span>
    </button>
    <button class="btn" id="copy" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <span class="lbl-full">Copy location</span><span class="lbl-short">Copy</span>
    </button>
    <button class="btn btn--icon is-on" id="autochange" type="button" aria-pressed="true"
            aria-label="Stop changing place every minute" title="Change place every minute">
      <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/><path d="M4.5 4.5l15 15"/></svg>
    </button>
    <button class="btn btn--icon is-on" id="autopan" type="button" aria-pressed="true"
            aria-label="Stop the slow drift" title="Drift slowly">
      <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/><path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/><path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/><path d="M4.5 4.5l15 15"/></svg>
    </button>
    <button class="btn btn--icon btn--sound is-armed" id="sound" type="button"
            aria-pressed="false" aria-label="Turn sound on" title="Sound">
      <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m17 9 4 6M21 9l-4 6"/></svg>
      <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.8a9 9 0 0 1 0 12.4"/></svg>
    </button>
  </div>
  <p class="credit">Created by <a href="mailto:anurag27k@gmail.com">Anurag</a></p>
</div>

<a class="attribution" id="attribution" href="https://www.google.com/maps" target="_blank" rel="noopener">Imagery &copy; Google</a>

<script>
/* ---------------- elements ---------------- */
const $stage   = document.getElementById('stage');
const $pano    = document.getElementById('pano');
const $placard = document.getElementById('placard');
const $place   = document.getElementById('place');
const $country = document.getElementById('country');
const $coords  = document.getElementById('coords');
const $rule    = document.getElementById('rule');
const $fill    = document.getElementById('fill');
const $toast   = document.getElementById('toast');
const $hint    = document.getElementById('hint');
const $sound   = document.getElementById('sound');
const $autochange = document.getElementById('autochange');
const $autopan = document.getElementById('autopan');
const $attr    = document.getElementById('attribution');

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const CYCLE_MS = 60000;   // a new place every minute

/* =================================================================
   AMBIENT ENGINE  —  synthesised in the browser, royalty-free by
   construction. Five moods, matched to the terrain.
================================================================= */
const MOOD = {
  alpine:{ root:220.00, chord:[0,7,12,19],  wave:'sine',     cutoff:1150, q:.6,
           noise:'wind',    noiseGain:.050, scale:[0,3,5,7,10,12,15], bell:[5,12], bellGain:.085, detune:5,  pulse:0 },
  city:{   root:110.00, chord:[0,7,10,15],  wave:'sawtooth', cutoff:420,  q:1.2,
           noise:'rumble',  noiseGain:.030, scale:[0,3,5,7,10,12,14], bell:[3,8],  bellGain:.060, detune:8,  pulse:2.6 },
  coast:{  root:146.83, chord:[0,7,16,23],  wave:'triangle', cutoff:880,  q:.7,
           noise:'surf',    noiseGain:.070, scale:[0,2,4,7,9,12,16],  bell:[4,10], bellGain:.075, detune:4,  pulse:0 },
  desert:{ root:98.00,  chord:[0,7,13,19],  wave:'sawtooth', cutoff:500,  q:.9,
           noise:'dust',    noiseGain:.042, scale:[0,1,4,5,7,8,11],   bell:[7,15], bellGain:.070, detune:10, pulse:0 },
  verdant:{root:130.81, chord:[0,7,14,19],  wave:'triangle', cutoff:980,  q:.6,
           noise:'trickle', noiseGain:.048, scale:[0,2,4,7,9,11,14],  bell:[3,9],  bellGain:.080, detune:3,  pulse:0 }
};

const VOLUME = 0.5;
let actx=null, master=null, reverb=null, noiseBuf=null;
let layer=null, activeMood=null, pendingMood='verdant';
let soundOn=false, audioReady=false;

function initAudio(){
  if(actx) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return false;
  actx = new AC();

  master = actx.createGain();
  master.gain.value = 0;
  const limiter = actx.createDynamicsCompressor();
  limiter.threshold.value=-16; limiter.knee.value=12;
  limiter.ratio.value=6; limiter.attack.value=.01; limiter.release.value=.3;
  master.connect(limiter); limiter.connect(actx.destination);

  reverb = actx.createConvolver();
  const len = Math.floor(actx.sampleRate*3.4);
  const ir = actx.createBuffer(2, len, actx.sampleRate);
  for(let c=0;c<2;c++){
    const d = ir.getChannelData(c);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,2.4);
  }
  reverb.buffer = ir;
  const wet = actx.createGain(); wet.gain.value=.85;
  reverb.connect(wet); wet.connect(master);

  const nlen = actx.sampleRate*3;
  noiseBuf = actx.createBuffer(1, nlen, actx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<nlen;i++){
    const w = Math.random()*2-1;
    b0=.997*b0+w*.0990; b1=.985*b1+w*.0757; b2=.950*b2+w*.1538;
    nd[i]=(b0+b1+b2+w*.1848)*.4;
  }
  audioReady = true;
  return true;
}

function panner(){
  if(actx.createStereoPanner){ const p=actx.createStereoPanner(); p.pan.value=Math.random()*1.4-.7; return p; }
  return actx.createGain();
}

function buildLayer(mood){
  const cfg = MOOD[mood] || MOOD.verdant;
  const L = { nodes:[], timers:[], dead:false };

  const g = actx.createGain(); g.gain.value = 0; g.connect(master);
  const send = actx.createGain(); send.gain.value=.5; g.connect(send); send.connect(reverb);
  L.gain = g;

  const filt = actx.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.value=cfg.cutoff; filt.Q.value=cfg.q; filt.connect(g);

  const lfo = actx.createOscillator(); lfo.frequency.value=.028+Math.random()*.035;
  const lfoAmt = actx.createGain(); lfoAmt.gain.value=cfg.cutoff*.34;
  lfo.connect(lfoAmt); lfoAmt.connect(filt.frequency); lfo.start(); L.nodes.push(lfo);

  cfg.chord.forEach((iv,idx)=>{
    for(let d=-1; d<=1; d+=2){
      const o = actx.createOscillator();
      o.type = cfg.wave;
      o.frequency.value = cfg.root*Math.pow(2,iv/12);
      o.detune.value = d*cfg.detune + (Math.random()*4-2);
      const base = .095/(idx*.55+1);
      const og = actx.createGain(); og.gain.value = base;
      const alfo = actx.createOscillator(); alfo.frequency.value=.017+Math.random()*.05;
      const aamt = actx.createGain(); aamt.gain.value=base*.55;
      alfo.connect(aamt); aamt.connect(og.gain); alfo.start();
      o.connect(og); og.connect(filt); o.start();
      L.nodes.push(o, alfo);
    }
  });

  const ns = actx.createBufferSource(); ns.buffer=noiseBuf; ns.loop=true;
  const nf = actx.createBiquadFilter();
  if(cfg.noise==='wind'){ nf.type='highpass'; nf.frequency.value=1500; }
  else if(cfg.noise==='rumble'){ nf.type='lowpass'; nf.frequency.value=320; }
  else if(cfg.noise==='surf'){ nf.type='lowpass'; nf.frequency.value=850; }
  else if(cfg.noise==='dust'){ nf.type='bandpass'; nf.frequency.value=650; nf.Q.value=.7; }
  else { nf.type='bandpass'; nf.frequency.value=2300; nf.Q.value=1.3; }
  const ng = actx.createGain(); ng.gain.value=cfg.noiseGain;
  const slfo = actx.createOscillator(); slfo.frequency.value = cfg.noise==='surf'?.085:.045;
  const samt = actx.createGain(); samt.gain.value=cfg.noiseGain*.75;
  slfo.connect(samt); samt.connect(ng.gain); slfo.start();
  ns.connect(nf); nf.connect(ng); ng.connect(g); ns.start();
  L.nodes.push(ns, slfo);

  const bell = ()=>{
    if(L.dead) return;
    const s = cfg.scale;
    const iv = s[Math.floor(Math.random()*s.length)] + (Math.random()<.35?12:0);
    const o = actx.createOscillator(); o.type='sine';
    o.frequency.value = cfg.root*2*Math.pow(2,iv/12);
    const bg = actx.createGain(); bg.gain.value=0;
    const p = panner();
    o.connect(bg); bg.connect(p); p.connect(g);
    const t = actx.currentTime;
    bg.gain.setValueAtTime(.0001,t);
    bg.gain.linearRampToValueAtTime(cfg.bellGain,t+.06);
    bg.gain.exponentialRampToValueAtTime(.0001,t+4.6);
    o.start(t); o.stop(t+4.8);
    const [lo,hi]=cfg.bell;
    L.timers.push(setTimeout(bell,(lo+Math.random()*(hi-lo))*1000));
  };
  L.timers.push(setTimeout(bell, 2200+Math.random()*3000));

  if(cfg.pulse){
    const thump = ()=>{
      if(L.dead) return;
      const o = actx.createOscillator(); o.type='sine';
      const t = actx.currentTime;
      o.frequency.setValueAtTime(70,t);
      o.frequency.exponentialRampToValueAtTime(38,t+.5);
      const pg = actx.createGain();
      pg.gain.setValueAtTime(.0001,t);
      pg.gain.linearRampToValueAtTime(.14,t+.03);
      pg.gain.exponentialRampToValueAtTime(.0001,t+1.1);
      o.connect(pg); pg.connect(g); o.start(t); o.stop(t+1.2);
      L.timers.push(setTimeout(thump, cfg.pulse*1000));
    };
    L.timers.push(setTimeout(thump, 900));
  }

  g.gain.setTargetAtTime(1, actx.currentTime, 1.1);
  return L;
}

function killLayer(L){
  if(!L) return;
  L.dead = true;
  L.timers.forEach(clearTimeout);
  try{ L.gain.gain.cancelScheduledValues(actx.currentTime);
       L.gain.gain.setTargetAtTime(0, actx.currentTime, .45); }catch(e){}
  setTimeout(()=>{
    L.nodes.forEach(n=>{ try{n.stop();}catch(e){} try{n.disconnect();}catch(e){} });
    try{ L.gain.disconnect(); }catch(e){}
  }, 2200);
}

function setMood(mood){
  pendingMood = mood;
  if(!audioReady || !soundOn) return;
  if(activeMood === mood && layer && !layer.dead) return;
  const old = layer;
  layer = buildLayer(mood);
  activeMood = mood;
  killLayer(old);
}

function soundToggle(force){
  const want = (typeof force === 'boolean') ? force : !soundOn;
  if(want){
    if(!initAudio()){ showToast('Sound is unavailable here'); return; }
    if(actx.state === 'suspended') actx.resume();
    soundOn = true;
    setMood(pendingMood);
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setTargetAtTime(VOLUME, actx.currentTime, .8);
  }else{
    soundOn = false;
    if(master){
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setTargetAtTime(0, actx.currentTime, .35);
    }
    setTimeout(()=>{ if(soundOn) return; killLayer(layer); layer=null; activeMood=null; }, 1000);
  }
  $sound.classList.toggle('is-on', soundOn);
  $sound.classList.remove('is-armed');
  $sound.setAttribute('aria-pressed', String(soundOn));
  $sound.setAttribute('aria-label', soundOn ? 'Turn sound off' : 'Turn sound on');
  showToast(soundOn ? 'Sound on' : 'Sound off');
}

let armed = true;
function firstGesture(e){
  if(!armed) return;
  armed = false;
  window.removeEventListener('pointerdown', firstGesture, true);
  const onToggle = e.target && e.target.closest && e.target.closest('#sound');
  if(onToggle){ initAudio(); return; }
  soundToggle(true);
}
window.addEventListener('pointerdown', firstGesture, true);

/* ---------------- shuffle bag ---------------- */
let bag = [], current = null;
function draw(){
  if(bag.length === 0){
    bag = PLACES.map((_,i)=>i);
    for(let i=bag.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [bag[i],bag[j]] = [bag[j],bag[i]];
    }
    if(current !== null && bag[bag.length-1] === current && bag.length > 1){
      [bag[0],bag[bag.length-1]] = [bag[bag.length-1],bag[0]];
    }
  }
  return bag.pop();
}

/* ---------------- readout ---------------- */
function pad(v,n){
  const s = Math.abs(v).toFixed(4).split('.');
  return s[0].padStart(n,'0') + '.' + s[1];
}
function fmt(lat,lng){
  return pad(lat,2)+'\u00B0'+(lat>=0?'N':'S')+'  '+
         pad(lng,3)+'\u00B0'+(lng>=0?'E':'W');
}

const GLYPHS = '0123456789';
let scrambleTimer=null, settleTimer=null;

function startScramble(){
  clearInterval(scrambleTimer); clearTimeout(settleTimer);
  $coords.classList.add('is-searching');
  const shape = '00.0000\u00B0N  000.0000\u00B0E';
  if(reduceMotion){ $coords.textContent = shape; return; }
  scrambleTimer = setInterval(()=>{
    let out='';
    for(const ch of shape) out += /\d/.test(ch) ? GLYPHS[Math.floor(Math.random()*10)] : ch;
    $coords.textContent = out;
  },55);
}

function settle(target){
  clearInterval(scrambleTimer); clearTimeout(settleTimer);
  $rule.classList.remove('is-locking'); void $rule.offsetWidth; $rule.classList.add('is-locking');
  if(reduceMotion){
    $coords.textContent = target; $coords.classList.remove('is-searching'); return;
  }
  let locked = 0;
  const step = ()=>{
    locked++;
    let out='';
    for(let i=0;i<target.length;i++){
      const ch = target[i];
      out += (i < locked || !/\d/.test(ch)) ? ch : GLYPHS[Math.floor(Math.random()*10)];
    }
    $coords.textContent = out;
    if(locked < target.length) settleTimer = setTimeout(step, 26);
    else $coords.classList.remove('is-searching');
  };
  step();
}

/* ---------------- going somewhere ---------------- */
let here=null, autoChange=true, autoPan=!reduceMotion, cycleTimer=null, loadGuard=null;

// every new place starts a fresh right-to-left pass
function restartPan(){
  $pano.classList.remove('is-panning');
  void $pano.offsetWidth;
  if(autoPan) $pano.classList.add('is-panning');
}

function embedUrl(lat,lng,h){
  return 'https://maps.google.com/maps?q=&layer=c&cbll=' + lat + ',' + lng +
         '&cbp=11,' + h + ',0,0,0&hl=en&output=svembed';
}
function mapsUrl(lat,lng,h){
  return 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' +
         lat + ',' + lng + '&heading=' + h + '&pitch=0&fov=80';
}

function armCycle(){
  clearTimeout(cycleTimer);
  $fill.classList.remove('is-running'); $fill.style.width = '0';
  if(!autoChange) return;
  void $fill.offsetWidth;
  $fill.classList.add('is-running');
  cycleTimer = setTimeout(goSomewhere, CYCLE_MS);
}

function goSomewhere(){
  clearTimeout(cycleTimer);
  $fill.classList.remove('is-running'); $fill.style.width = '0';

  const i = draw();
  current = i;
  const [name,country,lat,lng,h,mood] = PLACES[i];
  here = { name:name, country:country, lat:lat, lng:lng, heading:h };

  $placard.classList.add('is-swapping');
  $stage.classList.add('is-loading');
  $hint.classList.remove('is-on');
  startScramble();
  setMood(mood);
  $attr.href = mapsUrl(lat,lng,h);

  setTimeout(()=>{
    $place.textContent = name;
    $country.textContent = country;
    $placard.classList.remove('is-swapping');
  }, reduceMotion ? 0 : 300);

  $pano.src = embedUrl(lat,lng,h);

  const arrive = ()=>{
    $stage.classList.remove('is-loading');
    settle(fmt(lat,lng));
    armCycle();
    restartPan();
    setTimeout(()=>$hint.classList.add('is-on'), 500);
    setTimeout(()=>$hint.classList.remove('is-on'), 4600);
  };

  clearTimeout(loadGuard);
  let done = false;
  $pano.onload = ()=>{ if(done) return; done = true; setTimeout(arrive, 400); };
  loadGuard = setTimeout(()=>{ if(done) return; done = true; arrive(); }, 4500);
}

/* ---------------- toast & copy ---------------- */
function showToast(msg){
  $hint.classList.remove('is-on');
  $toast.textContent = msg;
  $toast.classList.add('is-on');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>$toast.classList.remove('is-on'), 1900);
}

async function copyLocation(){
  if(!here) return;
  const url = mapsUrl(here.lat, here.lng, here.heading);
  try{
    await navigator.clipboard.writeText(url);
    showToast('Location copied');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = url; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, url.length);
    let ok=false; try{ ok = document.execCommand('copy'); }catch(_){}
    document.body.removeChild(ta);
    showToast(ok ? 'Location copied' : 'Copying is blocked here');
  }
}

/* ---------------- controls ---------------- */
document.getElementById('go').addEventListener('click', goSomewhere);
document.getElementById('copy').addEventListener('click', copyLocation);
$sound.addEventListener('click', ()=>soundToggle());

$autochange.addEventListener('click', ()=>{
  autoChange = !autoChange;
  $autochange.classList.toggle('is-on', autoChange);
  $autochange.setAttribute('aria-pressed', String(autoChange));
  $autochange.setAttribute('aria-label',
    autoChange ? 'Stop changing place every minute' : 'Change place every minute');
  if(autoChange){ armCycle(); }
  else { clearTimeout(cycleTimer); $fill.classList.remove('is-running'); $fill.style.width='0'; }
  showToast(autoChange ? 'Changing every minute' : 'Staying here');
});

$autopan.classList.toggle('is-on', autoPan);
$autopan.setAttribute('aria-pressed', String(autoPan));
$autopan.addEventListener('click', ()=>{
  autoPan = !autoPan;
  $autopan.classList.toggle('is-on', autoPan);
  $autopan.setAttribute('aria-pressed', String(autoPan));
  $autopan.setAttribute('aria-label', autoPan ? 'Stop the slow drift' : 'Drift slowly');
  if(autoPan) $pano.classList.add('is-panning');
  else $pano.classList.remove('is-panning');
  showToast(autoPan ? 'Drifting' : 'Drift paused');
});

document.addEventListener('visibilitychange', ()=>{
  if(!actx || !soundOn) return;
  master.gain.setTargetAtTime(document.hidden ? 0 : VOLUME, actx.currentTime,
                              document.hidden ? .3 : .8);
});

goSomewhere();
